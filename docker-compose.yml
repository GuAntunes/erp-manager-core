services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: erp_manager_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - erpmanager-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_manager_core"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  erpmanager-data:
